<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLSL Shaders Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
  #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 8px; align-items: center;
         padding: 8px 12px; background: rgba(0,0,0,.6); z-index: 2; }
  select, button { background: #222; color: #ddd; border: 1px solid #444; padding: 4px 8px; border-radius: 4px; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #err { position: fixed; left: 12px; right: 12px; bottom: 12px; max-height: 40%; overflow: auto; z-index: 2;
         white-space: pre-wrap; font: 12px ui-monospace, monospace; color: #ff8080;
         background: rgba(0,0,0,.8); padding: 8px; border-radius: 4px; display: none; }
  #src { margin-left: auto; color: #8ab4ff; text-decoration: none; }
</style>
</head>
<body>
<div id="bar">
  <select id="pick"></select>
  <button id="pause">Pause</button>
  <button id="restart">Restart</button>
  <a id="src" target="_blank" rel="noopener">Code</a>
</div>
<canvas id="c"></canvas>
<pre id="err"></pre>

<script>
"use strict";
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2");
const errBox = document.getElementById("err");
const pick = document.getElementById("pick");
const srcLink = document.getElementById("src");

if (!gl) { showError("WebGL2 is not supported for this browser."); }

const VS_ES1 = `attribute vec2 a_pos; void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }`;
const VS_ES3 = `#version 300 es
in vec2 a_pos; void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }`;

let program = null, uniforms = {}, t0 = performance.now(), tPaused = 0, paused = false;
const mouse = [0, 0, 0, 0];

function showError(msg) { errBox.textContent = msg; errBox.style.display = msg ? "block" : "none"; }

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    gl.deleteShader(s);
    throw new Error(log);
  }
  return s;
}

function build(fragSrc) {
  const isES3 = /^\s*#version\s+300\s+es/.test(fragSrc);
  const vs = compile(gl.VERTEX_SHADER, isES3 ? VS_ES3 : VS_ES1);
  const fs = compile(gl.FRAGMENT_SHADER, fragSrc);
  const p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, fs);
  gl.bindAttribLocation(p, 0, "a_pos");
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

function collectUniforms(p) {
  const out = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    out[info.name] = { loc: gl.getUniformLocation(p, info.name), type: info.type };
  }
  return out;
}

function setVec(u, values) {
  if (!u) return;
  switch (u.type) {
    case gl.FLOAT:      gl.uniform1f(u.loc, values[0]); break;
    case gl.FLOAT_VEC2: gl.uniform2f(u.loc, values[0], values[1]); break;
    case gl.FLOAT_VEC3: gl.uniform3f(u.loc, values[0], values[1], values[2] ?? 1); break;
    case gl.FLOAT_VEC4: gl.uniform4f(u.loc, values[0], values[1], values[2] ?? 0, values[3] ?? 0); break;
  }
}

async function loadShader(entry) {
  showError("");
  try {
    const res = await fetch(entry.path);
    if (!res.ok) throw new Error("Cannot load " + entry.path + " (" + res.status + ")");
    const src = await res.text();
    const p = build(src);
    if (program) gl.deleteProgram(program);
    program = p;
    uniforms = collectUniforms(p);
    srcLink.href = entry.path;
    t0 = performance.now(); tPaused = 0;
    history.replaceState(null, "", "?s=" + encodeURIComponent(entry.name));
  } catch (e) {
    showError(String(e.message || e));
  }
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.floor(canvas.clientWidth * dpr), h = Math.floor(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);
}

let frame = 0;
function render(now) {
  requestAnimationFrame(render);
  if (!program) return;
  resize();
  const t = ((paused ? tPaused : now - t0)) / 1000;
  if (!paused) tPaused = now - t0;
  gl.useProgram(program);
  const res = [canvas.width, canvas.height, 1];
  for (const k of ["iResolution", "u_resolution"]) setVec(uniforms[k], res);
  for (const k of ["iTime", "u_time"]) setVec(uniforms[k], [t]);
  for (const k of ["iMouse", "u_mouse"]) setVec(uniforms[k], mouse);
  setVec(uniforms.iFrame, [frame]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  if (!paused) frame++;
}

const vao = gl ? gl.createVertexArray() : null;
if (gl) {
  gl.bindVertexArray(vao);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
}

canvas.addEventListener("pointermove", e => {
  if (e.buttons) {
    const dpr = window.devicePixelRatio || 1;
    mouse[0] = e.clientX * dpr;
    mouse[1] = canvas.height - e.clientY * dpr;
  }
});

document.getElementById("pause").onclick = e => {
  paused = !paused;
  if (!paused) t0 = performance.now() - tPaused;
  e.target.textContent = paused ? "Resume" : "Pause";
};
document.getElementById("restart").onclick = () => { t0 = performance.now(); tPaused = 0; frame = 0; };

(async function init() {
  if (!gl) return;
  try {
    const list = await (await fetch("shaders.json")).json();
    for (const s of list) {
      const o = document.createElement("option");
      o.value = s.name; o.textContent = s.title || s.name;
      pick.appendChild(o);
    }
    const wanted = new URLSearchParams(location.search).get("s");
    const start = list.find(s => s.name === wanted) || list[0];
    pick.value = start.name;
    pick.onchange = () => loadShader(list.find(s => s.name === pick.value));
    await loadShader(start);
    requestAnimationFrame(render);
  } catch (e) {
    showError("Error reading shaders.json: " + e.message);
  }
})();
</script>
</body>
</html>
